<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上班鼓励器</title>
<style>
  :root{
    --bg1:#0d1020; --bg2:#221436;
    --body:#1c2138; --lcd:#0d1122; --line:#2b3152;
    --gold:#f5c542; --green:#5ee08a; --pink:#f78bb3;
    --text:#eef0ff; --muted:#8f96b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--bg1),var(--bg2));
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);padding:14px;
  }
  .calc{
    width:320px;background:var(--body);border:1px solid var(--line);
    border-radius:20px;padding:14px 16px 12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .titlebar{display:flex;align-items:center;gap:5px;padding:0 2px 10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .name{margin-left:6px;color:var(--muted);font-size:11px;letter-spacing:3px}
  .lcd{background:var(--lcd);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;font-variant-numeric:tabular-nums}
  #date{color:var(--muted);font-size:11px}
  #clock{font-size:28px;font-weight:700;margin-top:2px;letter-spacing:2px}
  .row{padding:10px 2px;text-align:center;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none;padding-bottom:2px}
  .label{color:var(--muted);font-size:11px}
  #countdown{font-size:24px;font-weight:700;color:var(--green);margin-top:2px;letter-spacing:1px;font-variant-numeric:tabular-nums}
  #note{color:var(--pink);font-size:10px;margin-top:3px;min-height:13px}
  #earned{font-size:34px;font-weight:800;color:var(--gold);margin-top:2px;font-variant-numeric:tabular-nums}
  .rate{color:var(--muted);font-size:10px;margin-top:3px}
  .bar{height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:8px}
  #fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .5s linear}
  .meta{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
  #worked{color:var(--text);font-weight:600}
  #month{font-size:20px;font-weight:700;color:var(--gold);margin-top:2px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <main class="calc">
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="name">上班鼓励器</span>
    </div>
    <div class="lcd">
      <div id="date"></div>
      <div id="clock"></div>
    </div>
    <div class="row">
      <div id="countdownLabel" class="label"></div>
      <div id="countdown"></div>
      <div id="note"></div>
    </div>
    <div class="row">
      <div class="label">今日已赚</div>
      <div id="earned"></div>
      <div class="rate">每秒 ¥0.04 · 时薪 ¥145.45 · 日薪 ¥1090.91</div>
    </div>
    <div class="row">
      <div class="bar"><div id="fill"></div></div>
      <div class="meta"><span id="progress"></span><span id="worked"></span></div>
    </div>
    <div class="row">
      <div class="label">本月累计已赚</div>
      <div id="month"></div>
    </div>
  </main>

<script>
  // 24000 元 / 22 天 / 7.5 小时（9:30-18:30 扣除 12:00-13:30 午休）
  const DAILY = 24000 / 22;
  const PER_SEC = DAILY / 7.5 / 3600;

  const START = 570, LUNCH_S = 720, LUNCH_E = 810, END = 1110; // 一天中的分钟数

  const elDate = document.getElementById('date');
  const elClock = document.getElementById('clock');
  const elLabel = document.getElementById('countdownLabel');
  const elCountdown = document.getElementById('countdown');
  const elNote = document.getElementById('note');
  const elEarned = document.getElementById('earned');
  const elFill = document.getElementById('fill');
  const elProgress = document.getElementById('progress');
  const elWorked = document.getElementById('worked');
  const elMonth = document.getElementById('month');

  const WEEK = '日一二三四五六';
  const pad = n => String(n).padStart(2, '0');

  // 当天已工作的秒数（午休期间冻结）
  function workSeconds(min) {
    if (min <= START) return 0;
    if (min >= END) return 7.5 * 3600;
    if (min <= LUNCH_S) return (min - START) * 60;
    if (min < LUNCH_E) return (LUNCH_S - START) * 60;
    return (min - START - 90) * 60;
  }

  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
          m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (d ? d + '天 ' : '') + pad(h) + ':' + pad(m) + ':' + pad(sec);
  }

  function fmtWorked(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return h + '小时' + pad(m) + '分';
  }

  // 下周一 9:30（休息日时用来倒计时）
  function nextWorkStart(now) {
    const t = new Date(now);
    t.setHours(9, 30, 0, 0);
    t.setDate(t.getDate() + (8 - now.getDay()) % 7);
    return t;
  }

  function tick() {
    const now = new Date();
    const day = now.getDay();
    const weekend = day === 0 || day === 6;
    const secOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const min = secOfDay / 60;

    elDate.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' +
                         now.getDate() + '日 星期' + WEEK[day];
    elClock.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    // 本月累计：今天之前已过的工作日 × 日薪 + 今日已赚
    let monthDays = 0;
    for (let d = 1; d < now.getDate(); d++) {
      const dow = new Date(now.getFullYear(), now.getMonth(), d).getDay();
      if (dow !== 0 && dow !== 6) monthDays++;
    }

    let earned = 0;
    let note = '';

    if (weekend) {
      elLabel.textContent = '距离下周一上班还有';
      elCountdown.textContent = fmtDur(nextWorkStart(now) - now);
      note = '今天休息不搬砖，下周一见';
    } else if (min < START) {
      elLabel.textContent = '距离上班还有';
      elCountdown.textContent = fmtDur((START * 60 - secOfDay) * 1000);
      note = '还没开工，坐等 9:30';
    } else if (min >= END) {
      elLabel.textContent = '已下班';
      elCountdown.textContent = '下班啦';
      earned = DAILY;
      note = day === 5 ? '明天周末，好好休息' : '今日工资全额到账';
    } else {
      elLabel.textContent = '距离下班还有';
      elCountdown.textContent = fmtDur((END * 60 - secOfDay) * 1000);
      earned = workSeconds(min) * PER_SEC;
      note = min >= LUNCH_S && min < LUNCH_E ? '午休中，工资暂停计时' : '加油！每秒进账 ¥0.04';
    }

    elNote.textContent = note;
    elEarned.textContent = '¥' + earned.toFixed(2);
    elFill.style.width = (earned / DAILY * 100).toFixed(2) + '%';
    elProgress.textContent = '今日工时进度 ' + (earned / DAILY * 100).toFixed(1) + '%';
    elWorked.textContent = '已工作 ' + fmtWorked(weekend ? 0 : workSeconds(min));
    elMonth.textContent = '¥' + (monthDays * DAILY + (weekend ? 0 : earned)).toFixed(2);
  }

  tick();
  setInterval(tick, 200);
</script>
</body>
</html>
