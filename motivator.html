<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上班鼓励器</title>
<style>
  :root{
    --bg1:#030a1c; --bg2:#071633;
    --panel1:#0e1f47; --panel2:#132a5e;
    --lcd:#02060f;
    --line:#24407e; --line-dark:#0a1636;
    --blue:#2f7bff; --cyan:#4fd8ff; --bright:#8fd4ff;
    --text:#dce9ff; --muted:#6f8fc0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(0deg, rgba(47,123,255,.05) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(47,123,255,.05) 0 1px, transparent 1px 40px),
      linear-gradient(150deg,var(--bg1),var(--bg2));
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);padding:14px;
  }
  .calc{
    width:320px;position:relative;border-radius:16px;padding:16px;
    background:linear-gradient(160deg,var(--panel1),var(--panel2));
    border:1px solid var(--line);
    box-shadow:
      0 20px 50px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.1),
      inset 0 -2px 0 rgba(0,0,0,.4);
  }
  .screw{position:absolute;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3d5d9e, #16294f 60%, #0a1428);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.25), 0 1px 2px rgba(0,0,0,.6)}
  .screw::after{content:'';position:absolute;left:2px;right:2px;top:5px;height:2px;background:#0a1428}
  .tl{top:7px;left:7px}.tl::after{transform:rotate(45deg)}
  .tr{top:7px;right:7px}.tr::after{transform:rotate(-45deg)}
  .bl{bottom:7px;left:7px}.bl::after{transform:rotate(-45deg)}
  .br{bottom:7px;right:7px}.br::after{transform:rotate(45deg)}
  .titlebar{display:flex;align-items:center;gap:5px;padding:0 2px 12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#16305e;box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}
  .name{margin-left:6px;color:#8fb4e8;font-size:11px;letter-spacing:4px;font-weight:600}
  .pwr{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .lcd{
    background:var(--lcd);border:1px solid var(--line-dark);border-radius:10px;
    padding:10px 12px;text-align:center;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.8), 0 0 12px rgba(47,123,255,.15);
  }
  #date{color:var(--muted);font-size:11px}
  #clock{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;margin-top:2px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 10px rgba(79,216,255,.6)}
  .row{padding:10px 2px;text-align:center;border-bottom:1px dashed var(--line-dark)}
  .row:last-child{border-bottom:none;padding-bottom:2px}
  .label{color:var(--muted);font-size:11px;letter-spacing:1px}
  #countdown{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:23px;font-weight:700;color:var(--cyan);margin-top:2px;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(79,216,255,.45)}
  #note{color:#7ea6e0;font-size:10px;margin-top:3px;min-height:13px}
  #earned{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:33px;font-weight:800;color:var(--bright);margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(79,216,255,.5)}
  .rate{color:var(--muted);font-size:10px;margin-top:3px}
  .bar{height:8px;background:#060d1f;border:1px solid var(--line-dark);border-radius:4px;overflow:hidden;position:relative;margin-top:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
  .bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#04070f calc(10% - 1px) 10%)}
  #fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px rgba(79,216,255,.6);transition:width .5s linear}
  .meta{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
  #worked{color:var(--text);font-weight:600}
  #month{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:var(--cyan);margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(79,216,255,.4)}
</style>
</head>
<body>
  <main class="calc">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="name">上班鼓励器</span>
      <span class="pwr"></span>
    </div>
    <div class="lcd">
      <div id="date"></div>
      <div id="clock"></div>
    </div>
    <div class="row">
      <div id="countdownLabel" class="label"></div>
      <div id="countdown"></div>
      <div id="note"></div>
    </div>
    <div class="row">
      <div class="label">今日已赚</div>
      <div id="earned"></div>
      <div class="rate">每秒 ¥0.04 · 时薪 ¥145.45 · 日薪 ¥1090.91</div>
    </div>
    <div class="row">
      <div class="bar"><div id="fill"></div></div>
      <div class="meta"><span id="progress"></span><span id="worked"></span></div>
    </div>
    <div class="row">
      <div class="label">本月累计已赚</div>
      <div id="month"></div>
    </div>
  </main>

<script>
  // 24000 元 / 22 天 / 7.5 小时（9:30-18:30 扣除 12:00-13:30 午休）
  const DAILY = 24000 / 22;
  const PER_SEC = DAILY / 7.5 / 3600;

  const START = 570, LUNCH_S = 720, LUNCH_E = 810, END = 1110; // 一天中的分钟数

  const elDate = document.getElementById('date');
  const elClock = document.getElementById('clock');
  const elLabel = document.getElementById('countdownLabel');
  const elCountdown = document.getElementById('countdown');
  const elNote = document.getElementById('note');
  const elEarned = document.getElementById('earned');
  const elFill = document.getElementById('fill');
  const elProgress = document.getElementById('progress');
  const elWorked = document.getElementById('worked');
  const elMonth = document.getElementById('month');

  const WEEK = '日一二三四五六';
  const pad = n => String(n).padStart(2, '0');

  // 当天已工作的秒数（午休期间冻结）
  function workSeconds(min) {
    if (min <= START) return 0;
    if (min >= END) return 7.5 * 3600;
    if (min <= LUNCH_S) return (min - START) * 60;
    if (min < LUNCH_E) return (LUNCH_S - START) * 60;
    return (min - START - 90) * 60;
  }

  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
          m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (d ? d + '天 ' : '') + pad(h) + ':' + pad(m) + ':' + pad(sec);
  }

  function fmtWorked(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return h + '小时' + pad(m) + '分';
  }

  // 下周一 9:30（休息日时用来倒计时）
  function nextWorkStart(now) {
    const t = new Date(now);
    t.setHours(9, 30, 0, 0);
    t.setDate(t.getDate() + (8 - now.getDay()) % 7);
    return t;
  }

  function tick() {
    const now = new Date();
    const day = now.getDay();
    const weekend = day === 0 || day === 6;
    const secOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const min = secOfDay / 60;

    elDate.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' +
                         now.getDate() + '日 星期' + WEEK[day];
    elClock.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    // 本月累计：今天之前已过的工作日 × 日薪 + 今日已赚
    let monthDays = 0;
    for (let d = 1; d < now.getDate(); d++) {
      const dow = new Date(now.getFullYear(), now.getMonth(), d).getDay();
      if (dow !== 0 && dow !== 6) monthDays++;
    }

    let earned = 0;
    let note = '';

    if (weekend) {
      elLabel.textContent = '距离下周一上班还有';
      elCountdown.textContent = fmtDur(nextWorkStart(now) - now);
      note = '今天休息不搬砖，下周一见';
    } else if (min < START) {
      elLabel.textContent = '距离上班还有';
      elCountdown.textContent = fmtDur((START * 60 - secOfDay) * 1000);
      note = '还没开工，坐等 9:30';
    } else if (min >= END) {
      elLabel.textContent = '已下班';
      elCountdown.textContent = '下班啦';
      earned = DAILY;
      note = day === 5 ? '明天周末，好好休息' : '今日工资全额到账';
    } else {
      elLabel.textContent = '距离下班还有';
      elCountdown.textContent = fmtDur((END * 60 - secOfDay) * 1000);
      earned = workSeconds(min) * PER_SEC;
      note = min >= LUNCH_S && min < LUNCH_E ? '午休中，工资暂停计时' : '加油！每秒进账 ¥0.04';
    }

    elNote.textContent = note;
    elEarned.textContent = '¥' + earned.toFixed(2);
    elFill.style.width = (earned / DAILY * 100).toFixed(2) + '%';
    elProgress.textContent = '今日工时进度 ' + (earned / DAILY * 100).toFixed(1) + '%';
    elWorked.textContent = '已工作 ' + fmtWorked(weekend ? 0 : workSeconds(min));
    elMonth.textContent = '¥' + (monthDays * DAILY + (weekend ? 0 : earned)).toFixed(2);
  }

  tick();
  setInterval(tick, 200);
</script>
</body>
</html>
