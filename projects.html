<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — HAIYI YU</title>
  <meta name="description" content="于海怡 HAIYI YU 的室内设计作品集">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="header">
    <nav class="nav" aria-label="主导航">
      <a href="projects.html" class="nav-logo">HAIYI YU</a>
      <div class="nav-actions">
        <ul class="nav-links">
          <li><a href="projects.html" class="active" data-i18n="nav.works">作品</a></li>
          <li><a href="index.html" data-i18n="nav.about">关于</a></li>
          <li><a href="#contact" data-i18n="nav.contact">联系</a></li>
        </ul>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">
          <span class="lang-option" data-lang="zh">中</span>
          <span class="lang-divider">/</span>
          <span class="lang-option" data-lang="en">EN</span>
        </button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <span class="theme-toggle-icon">◐</span>
        </button>
      </div>
    </nav>
  </header>

  <div class="page-wrapper">
    <main class="projects-page">
      <p class="section-label">Projects 2023–2025</p>
      <div class="project-grid" id="projectGrid"></div>
    </main>

    <footer class="site-footer" id="contact">
      <p class="section-label" data-i18n="contact.heading">联系</p>
      <div class="contact-links">
        <a href="mailto:hieee0103@outlook.com" class="contact-item">hieee0103@outlook.com</a>
        <a href="https://www.instagram.com/yu.interior_/" class="contact-item" target="_blank" rel="noopener">@yu.interior_</a>
      </div>
      <p class="footer-copy">stay curious. stay focused. stay professional. still in progress.</p>
    </footer>
  </div>

  <script src="js/project-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Render project grid
    const grid = document.getElementById('projectGrid');
    const lang = localStorage.getItem('portfolio-lang') || 'zh';

    projectOrder.forEach((id) => {
      const proj = projectData[id];
      const firstImg = proj.mainImages[0] || proj.processImages[0] || '';
      const hero = getImagePath(id, firstImg);
      const card = document.createElement('article');
      card.className = 'project-card';
      card.innerHTML = `
        <a href="project.html#${id}">
          <div class="project-card-image">
            <img src="${hero}" alt="${proj.title}" loading="lazy">
          </div>
          <div class="project-card-text">
            <span class="project-card-number">${id}</span>
            <h3 class="project-card-title">${proj.title}</h3>
            <p class="project-card-category">${proj.category[lang] || proj.category.en}</p>
          </div>
        </a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
